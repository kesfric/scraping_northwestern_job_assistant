<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Northwestern Student Job Board Alerts</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 560px;
    margin: 10vh auto;
    padding: 0 24px;
    line-height: 1.5;
    color: #1a1a1a;
    background: #fff;
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.25em; }
  p.sub { color: #555; margin-top: 0; }
  form { display: flex; gap: 8px; margin-top: 24px; }
  input[type="email"] {
    flex: 1;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  button {
    padding: 10px 18px;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #4e2a84;
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #status { margin-top: 16px; font-size: 0.95rem; }
  #status.error { color: #b00020; }
  #status.ok { color: #16794c; }
  footer { margin-top: 48px; font-size: 0.8rem; color: #888; }
</style>
</head>
<body>
  <h1>Northwestern Student Job Board Alerts</h1>
  <p class="sub">
    Get an email the moment a new on-campus student job is posted, instead of
    refreshing the Power BI board yourself.
  </p>

  <form id="subscribe-form">
    <input type="email" id="email" name="email" placeholder="you@u.northwestern.edu" required />
    <button type="submit">Subscribe</button>
  </form>
  <div id="status"></div>

  <footer>
    You'll get one confirmation email first. Every alert includes an unsubscribe link.
  </footer>

  <script>
    const form = document.getElementById("subscribe-form");
    const status = document.getElementById("status");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      button.disabled = true;
      status.textContent = "";
      status.className = "";

      try {
        const res = await fetch("/api/subscribe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "Something went wrong.");
        }

        status.className = "ok";
        status.textContent =
          data.message === "already-subscribed"
            ? "You're already subscribed."
            : "Check your inbox to confirm your subscription.";
        form.reset();
      } catch (err) {
        status.className = "error";
        status.textContent = err.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
